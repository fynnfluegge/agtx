[package]
name = "agtx"
version = "1.0.4"
edition = "2021"
description = "Terminal-native kanban board for managing coding agents"
authors = ["agtx contributors"]
license = "MIT"
repository = "https://github.com/fynnfluegge/agtx"
keywords = ["tui", "tmux", "agents", "kanban", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1.44", features = ["full"] }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# Already in the tree as `toml`'s own dependency, so this is free. Needed for
# the config *writer*: `toml::to_string_pretty` round-trips through the struct
# and destroys every comment and unrecognised key in a hand-edited file.
toml_edit = { version = "0.22", features = ["serde"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
which = "7.0"
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4"] }
sha2 = "0.10"

# Logging / audit trail
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# MCP server
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }

# Web server for `agtx serve` (feature = "serve"). Optional not for binary size
# — `tokio` above is unconditional with `features = ["full"]`, so the runtime is
# paid for either way — but for blast radius: this serves a board that can start
# agents running with `--dangerously-skip-permissions`, and an opt-in compile is
# one more step in front of that.
axum = { version = "0.8", features = ["ws"], optional = true }
# The pairing QR. `default-features = false` drops `image` and `svg`, which pull
# in an image codec stack for output this never produces — the only renderer
# here writes half-blocks to a terminal.
qrcode = { version = "0.14", default-features = false, optional = true }

[features]
default = []
test-mocks = ["dep:mockall"]
serve = ["dep:axum", "dep:qrcode"]

# Dev tooling for the smoke tests, not part of the shipped binary. Declared with
# an explicit path so it can live next to its only consumer in tests/smoke/
# rather than in an `examples/` directory that implies "here is how to use the
# library". Kept an example rather than a bin so `cargo install` never ships it,
# while `cargo test` still compiles it — a new `AgentSpec` field or enum variant
# breaks the build here instead of silently drifting from the runner.
[[example]]
name = "agent_matrix"
path = "tests/smoke/agent_matrix.rs"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
# `ServiceExt::oneshot` — drives a `Router` in-process, so the route tests need
# no listener, no port and no network.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[dependencies.mockall]
version = "0.13"
optional = true
