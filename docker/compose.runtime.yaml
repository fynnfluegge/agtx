# agtx runtime mode — the container as agtx's runtime, not a sandbox.
#
# The sandbox (compose.yaml) isolates agtx's state in a named volume and stages
# your host settings read-only, so nothing the agent does can reach the host.
# Runtime mode is the opposite of that isolation: it mounts your host's real
# config and state WRITABLE at their normal locations, so agtx writes its
# config, status, and updates straight to the host. It is the in-container
# equivalent of installing agtx on the host — another way to run agtx, not a
# jail. It is still a container with the same least-privilege caps.
#
#   PROJECT=/path/to/project docker compose -f compose.runtime.yaml up
#
# or via the launcher (AGTX_RUNTIME=1 selects this file):
#
#   AGTX_RUNTIME=1 ./docker/sandbox.sh path/to/your-project

services:
  sandbox:
    image: agtx-sandbox
    build:
      context: .
      args:
        # Host UID/GID so bind-mounted files come out owned by the host user.
        UID: ${AGTX_BUILD_UID:-1000}
        GID: ${AGTX_BUILD_GID:-1000}
    # Fixed name: lets sandbox.sh read the container's exit code via
    # `<runtime> inspect` (Podman's `compose up` reports 0 regardless).
    container_name: agtx-sandbox
    user: sandbox
    working_dir: /home/sandbox/workspace
    command: ["agtx", "/home/sandbox/workspace"]
    # TUI: needs a live TTY and stdin.
    stdin_open: true
    tty: true
    environment:
      # Tells the entrypoint to leave your real config untouched and let agtx
      # and Claude behave like a normal local run (no sandbox pre-configuration).
      - AGTX_MODE=runtime
    # Same least-privilege caps as the sandbox — it is still a container.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      # The project, writable — the path agtx works on.
      - ${PROJECT}:/home/sandbox/workspace
      # Your real agtx config AND state, WRITABLE, at the normal location. This
      # is what "writes config/status/updates back to the host" means: config.toml,
      # plugins/, the trust store, and the project databases all live here.
      - ${HOME}/.config/agtx:/home/sandbox/.config/agtx
      # Your real Claude config and credentials, WRITABLE, at the normal location.
      - ${HOME}/.claude:/home/sandbox/.claude
      # Your real Claude onboarding/trust file, WRITABLE.
      - ${HOME}/.claude.json:/home/sandbox/.claude.json
